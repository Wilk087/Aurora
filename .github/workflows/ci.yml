name: CI

on:
  push:
    branches: [main, dev, tweaks]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # package.json is the single source of truth for the version. This fails
      # if PKGBUILD or flake.nix have drifted away from it.
      - name: Check version consistency
        run: npm run check-version

      # NOTE: currently allowed to fail. There are known type errors in
      # MiniPlayerView.vue and src/plugins/api.ts from the lyrics return-shape
      # change (getLyrics returns an object now, those two still treat it as a
      # string). Once those are fixed, delete continue-on-error so type errors
      # block the build.
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
